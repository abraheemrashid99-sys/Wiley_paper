# Rehearsal on natural text without any pretrained model.
#
# A small transformer is trained from scratch as a language model, mostly on
# AG News, and then frozen; it stands in for the pretrained LLM. TeleQnA is the
# specialised domain it knows little about. Both corpora come from GitHub, so
# this config also runs where Hugging Face is unreachable.
# Purpose: check the whole method on real text in minutes before spending
# hours with a real LLM. It is NOT a result of the paper.
name: rehearsal
seed: 0
device: cpu
out_dir: runs/rehearsal
backbone:
  name: tiny-random
  tiny: {hidden: 192, layers: 3, heads: 4, vocab: 8000, lm_steps: 4000, lm_lr: 2.0e-3, lm_focus: ag_news, lm_other_share: 0.02, corpora: [ag_news, teleqna]}
codec:
  granularities: [2, 4, 8, 16]
  max_tokens: 48
  codebook_hidden: 256
  lora: {r: 8, alpha: 16, dropout: 0.0, targets: [q_proj, v_proj], last_n: 0, slots: 2}
channel: {type: awgn, snr_train: [0.0, 20.0]}
data:
  cache_dir: data
  base: [ag_news]
  min_words: 4
  max_words: 30
  max_sentences: 60000
pretrain:
  steps: 2000
  batch_tokens: 256
  lr: 2.0e-3
  warmup: 100
  eval_every: 500
  eval_tokens: 2000
  log_every: 100
stream:
  kind: hier
  domains: [teleqna, ag_news]
  cycles: 2
  tau_slow: 150
  tau_med: 30
  temporal_corpus: teleqna
  temporal_steps: 300
  temporal_eras: 3
  batch_size: 8
  snr: {mean: 10.0, rho: 0.95, sigma: 4.0, min: 0.0, max: 20.0}
  m_op: 4
  probe_size: 64
  gen_every: 0
  gen_sentences: 8
  live_every: 47          # free-running audit of refinement every 47th step (a prime: not in phase with any shipping period)
  live_thresholds: [0.5, 0.7, 0.9]   # the thresholds around the target accuracy, and the operating one
eval:
  snrs: [0.0, 10.0, 20.0]
  channels: [awgn, rayleigh]
  n_test: 100
  batch_size: 16
  sim_model: null
refine: {n_val: 150, n_test: 200, n_live: 50, live_thresholds: [0.5, 0.7, 0.9]}
