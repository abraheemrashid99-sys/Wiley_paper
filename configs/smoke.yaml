# Offline smoke test: a tiny backbone and synthetic toy text; needs no download.
# The tiny model is first trained as a language model, mostly on the base toy
# domain, and then frozen: it is a good prior for the base domain and a poorer
# one for the stream domains, as a general LLM is for a specialised domain.
# It verifies that the pipeline works; its numbers mean nothing scientifically.
name: smoke
seed: 0
device: cpu
out_dir: runs/smoke
backbone:
  name: tiny-random
  tiny: {hidden: 96, layers: 2, heads: 4, vocab: 600, lm_steps: 800, lm_focus: toy_a, lm_other_share: 0.05}
codec:
  granularities: [1, 2, 4, 8]
  max_tokens: 32
  codebook_hidden: 64
  lora: {r: 4, alpha: 8, dropout: 0.0, targets: [q_proj, v_proj], last_n: 0, slots: 2}
context: {enabled: true, max_tokens: 32}
channel: {type: awgn, snr_train: [0.0, 20.0]}
data:
  cache_dir: data
  base: [toy_a]
  min_words: 4
  max_words: 30
  max_sentences: 5000
pretrain:
  steps: 400
  batch_tokens: 256
  lr: 3.0e-3
  warmup: 20
  eval_every: 200
  eval_tokens: 1000
  log_every: 100
stream:
  kind: hier
  domains: [toy_b, toy_c]
  cycles: 2
  tau_slow: 40
  tau_med: 10
  temporal_corpus: toy_b
  temporal_steps: 60
  temporal_eras: 3
  batch_size: 16
  snr: {mean: 5.0, rho: 0.95, sigma: 3.0, min: 0.0, max: 15.0}
  m_op: 2
  probe_size: 48
  gen_every: 40
  gen_sentences: 8
  live_every: 10          # every 10th step is also decoded for real (free-running refinement audit)
nested:
  periods: {medium: 5, slow: 20}
  lrs: {medium: 2.0e-3, slow: 5.0e-4}
  ewc_batches: 4
eval:
  snrs: [0.0, 10.0, 20.0]
  channels: [awgn, rayleigh]
  priors: [llm_ctx, llm, unigram, none]
  n_test: 64
  batch_size: 32
  sim_model: null
refine: {n_val: 64, n_test: 64, n_live: 32, live_thresholds: [0.5, 0.7, 0.9]}
