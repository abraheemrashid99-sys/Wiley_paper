# Second backbone family: Qwen2.5-0.5B (Apache-2.0).
# Repeats the headline experiments on a different architecture and tokenizer
# so that no conclusion rests on a single model family. Heaviest config: run
# it last, on a GPU if one is available.
name: scale
seed: 0
device: auto            # CUDA or Apple MPS when present, else CPU
out_dir: runs/scale
backbone:
  name: Qwen/Qwen2.5-0.5B
codec:
  granularities: [2, 4, 6, 8, 12, 16]     # real channel symbols per token
  max_tokens: 64
  codebook_hidden: 256
  peak_ratio: 4.0
  lora: {r: 8, alpha: 16, dropout: 0.0, targets: [q_proj, v_proj], last_n: 8, slots: 2}
context: {enabled: true, max_tokens: 64}   # fast memory: the conversation so far, as decoded
channel: {type: awgn, snr_train: [0.0, 20.0]}
data:
  cache_dir: data
  base: [europarl]
  min_words: 4
  max_words: 30
  max_sentences: 60000
pretrain:
  steps: 3000
  batch_tokens: 256
  lr: 2.0e-3
  warmup: 100
  eval_every: 1000
  eval_tokens: 2000
  log_every: 50
stream:
  kind: hier
  domains: [ag_news, teleqna]
  cycles: 2
  tau_slow: 300
  tau_med: 60
  kappa: 0.9
  temporal_corpus: huffpost
  temporal_steps: 1200
  temporal_eras: 4
  batch_size: 16
  snr: {mean: 10.0, rho: 0.95, sigma: 4.0, min: 0.0, max: 20.0}
  m_op: 6                 # reference fixed prefix; every prefix and the selective curve are logged too
  thresholds: [0.5, 0.7, 0.9, 0.95, 0.99]
  threshold: 0.9
  target_acc: 0.9
  probe_size: 128
  gen_every: 50
  gen_sentences: 16
nested:
  periods: {medium: 20, slow: 100}
  lrs: {medium: 1.0e-3, slow: 5.0e-4}
  rule: local
  select_every: 10
  select_margin: 0.05
  sync: {bits: 8, topk: 1.0}
  single_period: auto
eval:
  snrs: [0.0, 5.0, 10.0, 15.0, 20.0]
  channels: [awgn, rayleigh]
  priors: [llm, unigram, none]
  n_test: 500
  batch_size: 16
  sim_model: sentence-transformers/all-MiniLM-L6-v2
refine: {n_val: 300, n_test: 500, n_live: 200, live_thresholds: [0.5, 0.7, 0.9]}
