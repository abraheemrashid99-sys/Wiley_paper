# Pretrained GPT-2 (124M) as the receiver's language prior, on a CPU.
#
# Every input of this configuration is available from GitHub, so it runs where
# Hugging Face is unreachable:
#   python scripts/fetch_gpt2.py --out models/gpt2      (once; about 650 MB)
# Where Hugging Face is reachable, backbone.name=openai-community/gpt2 holds
# the same weights. The corpora are the GitHub-sourced variants described in
# docs/DATASETS.md.
name: gpt2
seed: 0
device: cpu
threads: 0
out_dir: runs/gpt2
backbone:
  name: models/gpt2
codec:
  granularities: [2, 4, 6, 8, 12, 16]     # real channel symbols per token
  max_tokens: 48
  codebook_hidden: 256
  peak_ratio: 4.0
  lora: {r: 8, alpha: 16, dropout: 0.0, targets: [c_attn], last_n: 6, slots: 2}
context: {enabled: true, max_tokens: 48}   # fast memory: the conversation so far, as decoded
channel: {type: awgn, snr_train: [0.0, 20.0]}
data:
  cache_dir: data
  base: [europarl_nltk]
  min_words: 4
  max_words: 30
  max_sentences: 40000
pretrain:
  steps: 2000
  batch_tokens: 256
  grans_per_step: 3
  lr: 2.0e-3
  warmup: 100
  eval_every: 500
  eval_tokens: 2000
  log_every: 50
stream:
  kind: hier
  domains: [ag_news, teleqna]
  cycles: 2
  tau_slow: 150
  tau_med: 30
  kappa: 0.9
  temporal_corpus: huffpost_gh
  temporal_steps: 600
  temporal_eras: 4
  batch_size: 6           # parallel conversations
  snr: {mean: 10.0, rho: 0.95, sigma: 4.0, min: 0.0, max: 20.0}
  m_op: 6                 # reference fixed prefix; every prefix and the selective curve are logged too
  thresholds: [0.5, 0.7, 0.9, 0.95, 0.99]
  threshold: 0.9
  target_acc: 0.9
  probe_size: 48
  gen_every: 0            # free-running decoding is checked on the probes
  gen_sentences: 4
  live_every: 23          # free-running audit of refinement every 23rd step (a prime: not in phase with any shipping period)
  live_thresholds: [0.5, 0.7, 0.9, 0.95, 0.99]   # every threshold of the curve: the target accuracy must be bracketed when decoding for real
decoder:                  # decoder of selective refinement, chosen on validation text only (docs/METHOD.md, section 2.5;
  beam: 4                 # results/decoder_selection): beam search of width 4 in every decoding pass,
  start_m: 6              # a first round of 6 symbols per token,
  reopen: false           # and a closed token is never requested again
  refine_power: message  # power of a refinement round: 'message' = gain of the whole message (runs of versions 0.2-0.4);
                         # 'subset' = unit power over the tokens the round carries (exact per round; use for new runs)
nested:
  periods: {medium: 10, slow: 50}
  lrs: {medium: 1.0e-3, slow: 5.0e-4}
  rule: local
  select_every: 10
  select_margin: 0.05
  sync: {bits: 8, topk: 1.0}
  single_period: auto
eval:
  snrs: [0.0, 10.0, 20.0]
  channels: [awgn, rayleigh]
  priors: [llm_ctx, llm, unigram, none]
  n_test: 200
  batch_size: 16
  sim_model: null
refine: {n_val: 150, n_test: 200, n_live: 64, live_thresholds: [0.5, 0.7, 0.9]}
