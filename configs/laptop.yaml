# CPU-only laptop config (sized for a Ryzen 7 3700U, 16 GB, no usable GPU).
# This is the headline configuration of the study.
#
# SmolLM2-135M is the frozen language prior at the receiver. The codebook is
# trained in minutes without the LLM; the LLM runs only when text is decoded
# and when the receiver's prior is adapted on the drift streams.
# Run scripts/benchmark_speed.py first: it prints what each stage will cost.
name: laptop
seed: 0
device: cpu
threads: 0              # 0 = PyTorch default; try threads=4 and threads=8 in the benchmark
out_dir: runs/laptop_v2
backbone:
  name: HuggingFaceTB/SmolLM2-135M
codec:
  granularities: [2, 4, 6, 8, 12, 16]     # real channel symbols per token
  max_tokens: 48
  codebook_hidden: 256
  peak_ratio: 4.0
  lora: {r: 8, alpha: 16, dropout: 0.0, targets: [q_proj, v_proj], last_n: 8, slots: 2}
context: {enabled: true, max_tokens: 64}   # fast memory: the conversation so far, as decoded
channel: {type: awgn, snr_train: [0.0, 20.0]}
data:
  cache_dir: data
  base: [europarl]
  min_words: 4
  max_words: 20
  max_sentences: 40000
pretrain:
  steps: 3000
  batch_tokens: 256
  lr: 2.0e-3
  warmup: 100
  eval_every: 1000
  eval_tokens: 2000
  log_every: 50
stream:
  kind: hier
  domains: [ag_news, teleqna]
  cycles: 2
  tau_slow: 150
  tau_med: 30
  kappa: 0.9
  temporal_corpus: huffpost
  temporal_steps: 600
  temporal_eras: 4
  batch_size: 8
  snr: {mean: 10.0, rho: 0.95, sigma: 4.0, min: 0.0, max: 20.0}
  m_op: 6                 # reference fixed prefix; every prefix and the selective curve are logged too
  thresholds: [0.5, 0.7, 0.9, 0.95, 0.99]
  threshold: 0.9
  target_acc: 0.9
  probe_size: 64
  gen_every: 50
  gen_sentences: 8
nested:
  periods: {medium: 10, slow: 50}
  lrs: {medium: 1.0e-3, slow: 5.0e-4}
  rule: local
  select_every: 10
  select_margin: 0.05
  sync: {bits: 8, topk: 1.0}
  single_period: auto
eval:
  snrs: [0.0, 10.0, 20.0]
  channels: [awgn, rayleigh]
  priors: [llm, unigram, none]
  n_test: 200
  batch_size: 16
  sim_model: sentence-transformers/all-MiniLM-L6-v2
refine: {n_val: 150, n_test: 200, n_live: 100, live_thresholds: [0.5, 0.7, 0.9]}
